<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Materia</title>
    <link rel="stylesheet" href="../Estilos/materias.css">
</head>
<body>

    <div class="container">
        <h1>Registro Materia</h1>
        <form>
            <label for="materia">Materia:</label>
            <input type="text" id="materia" name="materia" required>
            
            <button type="button" onclick="Validacion()">Registrar</button>
        </form>
    </div>
 
    <script>
        function Validacion(){
            const input = document.getElementById("materia");
            const materia = input.value.trim();
            const soloLetras = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;

            // si está vacío
            if (materia === "") {
                alert("Datos incorrectos: Ingrese el nombre de la materia.");
                return;
            }

            // Mas de una letra
            if (materia.length <= 1) {
                alert("Datos incorrectos: La materia debe tener más de una letra.");
                return;
            }

            //solo letras
            if (!soloLetras.test(materia)) {
                alert("Datos incorrectos: Ingrese solo letras.");
                return;
            }

            //la primera letra sea mayúscula
            const primeraLetra = materia.charAt(0);
            if (primeraLetra !== primeraLetra.toUpperCase() || primeraLetra === primeraLetra.toLowerCase()) {
                alert("Datos incorrectos: La primera letra debe ser mayúscula.");
                return;
            }
            alert("Datos correctos: Materia guardada.");
        }
    </script>
</body>
</html>
