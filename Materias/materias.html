<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias</title>
    <link rel="stylesheet" href="../Estilos/estilos.css">
</head>

<body>

        <h1>Registro de materias</h1>

        <form id="materiaFormulario" onsubmit="Validacion(event)">
            <label for="materia">Nombre de la materia:</label>

            <input type="text" id="materia" name="materia" maxlength="100" required
                pattern="[A-ZÁÉÍÓÚÜÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]*( [A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*">

            <br><br>

            <button type="submit">Guardar</button>
        </form>


    <div class="crud">
        <table>
            <caption>Materias registradas</caption>

            <thead>
                <tr>
                    <th scope="col">Nombre de la materia</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaMaterias">
                <tr>
                    <td>Materia</td>
                    <td>
                        <button type="button" onclick="editarMateria(this)">
                            Editar
                        </button>

                        <button type="button" onclick="eliminarMateria(this)">
                            Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <a href="../index.html">Volver al menú</a>

    <script>
        function Validacion(event) {
            event.preventDefault();

            const input = document.getElementById("materia");
            const materia = input.value.trim();

            if (materia === "") {
                alert("Ingresa el nombre de la materia.");
                return;
            }

            const tabla = document.getElementById("tablaMaterias");
            const fila = document.createElement("tr");

            const celdaMateria = document.createElement("td");
            celdaMateria.textContent = materia;

            const celdaAcciones = document.createElement("td");

            const botonEditar = document.createElement("button");
            botonEditar.type = "button";
            botonEditar.textContent = "Editar";
            botonEditar.onclick = function () {
                editarMateria(this);
            };

            const botonEliminar = document.createElement("button");
            botonEliminar.type = "button";
            botonEliminar.textContent = "Eliminar";
            botonEliminar.onclick = function () {
                eliminarMateria(this);
            };

            celdaAcciones.appendChild(botonEditar);
            celdaAcciones.appendChild(botonEliminar);

            fila.appendChild(celdaMateria);
            fila.appendChild(celdaAcciones);

            tabla.appendChild(fila);

            document.getElementById("materiaFormulario").reset();

            alert("Materia registrada correctamente.");
        }

        function editarMateria(boton) {
            const fila = boton.closest("tr");
            const celda = fila.cells[0];
            const nombreActual = celda.textContent;

            const nuevoNombre = prompt(
                "Ingresa el nuevo nombre de la materia:",
                nombreActual
            );

            if (nuevoNombre === null || nuevoNombre.trim() === "") {
                return;
            }

            const nombre = nuevoNombre.trim();
            const patron = /^[A-ZÁÉÍÓÚÜÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]*( [A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*$/;

            if (!patron.test(nombre)) {
                alert("El nombre debe comenzar con mayúscula y contener solo letras y espacios.");
                return;
            }

            celda.textContent = nombre;
            alert("Materia actualizada correctamente.");
        }

        function eliminarMateria(boton) {
            const confirmar = confirm(
                "¿Estás seguro de que deseas eliminar esta materia?"
            );

            if (confirmar) {
                boton.closest("tr").remove();
                alert("Materia eliminada correctamente.");
            }
        }
    </script>

</body>

</html>
