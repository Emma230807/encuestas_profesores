<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de encuestas a profesores</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background: beige;
            color: black;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #228B22;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
        }

        nav a,
        .dropbtn {
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: normal;
            color: white;
            text-decoration: none;
            background-color: transparent;
            border: none;
            cursor: pointer;
            margin: 5px 15px;
            padding: 0;
        }

        nav a:hover,
        .dropbtn:hover {
            color: rgb(231, 125, 13);
        }

        main {
            padding-right: 20px;
            padding-left: 20px;
            box-sizing: border-box;
            background-color: beige;
        }

        iframe {
            display: block;
            width: 100%;
            height: 70vh;
            border: none;
            background-color: white;
        }

        footer {
            background: beige;
            color: black;
            text-align: center;
            padding: 15px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
            margin: 0 15px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 10px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropbtn {
            background-color: transparent;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>S E A P</h1>
        <nav>
            <a href="{{ url_for('inicioS1') }}" target="contenido">Inicio</a>
            <div class="dropdown">
                <button class="dropbtn">Grupos</button>
                <div class="dropdown-content">
                    <a href="{{ url_for('agregarGrupo') }}" target="contenido">Agregar</a>
                    <a href="{{ url_for('gestionGrupos') }}" target="contenido">Gestion</a>
                </div>
            </div>

            <div class="dropdown">
                <button class="dropbtn">Profesores</button>
                <div class="dropdown-content">
                    <a href="{{ url_for('agregarProfesor') }}" target="contenido">Agregar</a>
                    <a href="{{ url_for('gestionProfesores') }}" target="contenido">Gestion</a>
                </div>
            </div>

            <div class="dropdown">
                <button class="dropbtn">Preguntas</button>
                <div class="dropdown-content">
                    <a href="{{ url_for('agregarPregunta') }}" target="contenido">Agregar</a>
                    <a href="{{ url_for('gestionPreguntas') }}" target="contenido">Gestion</a>
                </div>
            </div>

            <div class="dropdown">
                <button class="dropbtn">Materias</button>
                <div class="dropdown-content">
                    <a href="{{ url_for('agregarMateria') }}" target="contenido">Agregar</a>
                    <a href="{{ url_for('gestionMaterias') }}" target="contenido">Gestion</a>
                </div>
            </div>

            <div class="dropdown">
                <button class="dropbtn">Sesiones</button>
                <div class="dropdown-content">
                    <a href="{{ url_for('agregarSesion') }}" target="contenido">Agregar</a>
                    <a href="{{ url_for('gestionSesion') }}" target="contenido">Gestion</a>
                </div>
            </div>

            <div class="dropdown">
                <button class="dropbtn">Asignaciones</button>
                <div class="dropdown-content">
                    <a href="{{ url_for('agregarAsignacion') }}" target="contenido">Agregar</a>
                    <a href="{{ url_for('gestionAsignacion') }}" target="contenido">Gestion</a>
                </div>
            </div>

            <a href="{{ url_for('generarReporte') }}" target="contenido">Reportes</a>
        </nav>
    </header>

    <main>
        <!-- Contenido de cada página -->
        <iframe name="contenido" src="{{ url_for('inicioS1') }}"></iframe>
    </main>

    <footer>
        <p>&copy; 2026 Sistema de Encuestas a Profesores</p>
    </footer>
</body>

</html>
