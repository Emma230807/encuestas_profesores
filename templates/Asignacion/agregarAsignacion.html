<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/estilos.css') }}">
    <title>Asignación de profesores</title>
</head>
<body>
    <h1>Asignación de profesores</h1>
    
    <form id="asignacionFormulario" onsubmit="validarAsignacion(event)" action="guardarAsig" method="POST">
        {% if mensaje %}
            <script>
                alert("{{mensaje}}")
            </script>
        {% endif %}  
        <label for="profesor">Profesor:</label><br><br>
        <label for="profesor">Profesor:</label>
        <select id="profesor" name="profesor" required>
        <option value="">Seleccione un profesor</option>
        {% for pro in profesores %}
        <option value="{{ pro[0] }}">{{ pro[1] }}</option>
        {% endfor %}
        </select>
        <br><br>

        <label for="grupo">Grupo:</label><br><br>
        <select id="grupo" name="grupo" required>
            <option value="">Seleccione un grupo</option>
            {% for grupo in grupos %}
            <option value="{{ grupo[0] }}">{{ grupo[0] }}</option>
            {% endfor %}
        </select>
        <br><br>

        <label for="materia">Materia:</label><br><br>
        <select id="materia" name="materia" required>
            <option value="">Seleccione una materia</option>
            {% for mat in materias %}
            <option value="{{ mat[0] }}">{{ mat[1] }}</option>
            {% endfor %}
        </select>
        <br><br>

        <button type="submit">Asignar</button>
        <button type="reset">Limpiar</button>
    </form>
    <script src="../Scripts/asignaciones.js"></script>
</body>
</html>
