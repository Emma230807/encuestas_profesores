<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Gestion de Asignaciones</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/estilos.css') }}">
</head>
<body>
    <div class="crud">
        <table>
            <caption>Asignaciones resgistradas</caption>

            <thead>
                <tr>
                    <th scope="col">Clave asignacion</th>
                    <th scope="col">Profesor</th>
                    <th scope="col">Grupo al que imparte clase</th>
                    <th scope="col">Materia que imparte</th>
                </tr>
            </thead>

            <tbody id="tablaSesiones">
                 {% for asig in asignasiones %}
                <tr>
                    <td>
                        {{ asig[0] }}
                    </td>
                    <td>
                       {{ asig[1] }}
                    </td>
                    <td>
                       {{ asig[2] }}
                    </td>
                    <td>
                       {{ asig[3] }}

                    </td>
                    <td>
                        <button type="button" onclick="editarMateria(this)">
                            Editar
                        </button>

                        <button type="button" onclick="eliminarMateria(this)">
                            Eliminar
                        </button>
                    </td>
                </tr>
                {% endfor %}  
            </tbody>
        </table>
    </div>

  
</body>
</html>
