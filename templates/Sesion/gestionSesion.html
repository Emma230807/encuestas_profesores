<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Gestion de Sesiones</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/estilos.css') }}">
</head>
<body>
    <div class="crud">
        <table>
            <caption>Sesiones registradas</caption>

            <thead>
                <tr>
                    <th scope="col">Clave sesion</th>
                    <th scope="col">Grupo asignado</th>
                    <th scope="col">Fecha</th>
                    <th scope="col">Hora inicio</th>
                    <th scope="col">Hora fin</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaSesiones">
                 {% for sesion in sesiones %}
                <tr>
                    <td>
                        {{ sesion[0] }}
                    </td>
                    <td>
                       {{ sesion[1] }}
                    </td>
                    <td>
                       {{ sesion[2] }}
                    </td>
                    <td>
                       {{ sesion[3] }}

                    </td>
                    <td>
                       {{ sesion[4] }}
                    </td>
                    <td>
                        <button type="button" onclick="editarMateria(this)">
                            Editar
                        </button>

                        <button type="button" onclick="eliminarMateria(this)">
                            Eliminar
                        </button>
                    </td>
                </tr>
                {% endfor %}  
            </tbody>
        </table>
    </div>

  
</body>
</html>
