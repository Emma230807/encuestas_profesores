<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/estilos.css') }}">
</head>

<body>

    <h1>Registro de materias</h1>

    <form id="materiaFormulario" action="/seap/guardarMat" method="POST">
        {% if mensaje %}
            <script>
                alert("{{mensaje}}")
            </script>
        {% endif %}  
        <label for="materia">Nombre de la materia:</label>

        <input type="text" id="materia" name="materia" maxlength="100" required
            pattern="[A-ZÁÉÍÓÚÜÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]*( [A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*">

        <br><br>

        <button type="submit">Guardar</button>
    </form>

   

</body>

</html>
