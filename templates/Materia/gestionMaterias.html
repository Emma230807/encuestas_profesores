<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Gestion de Materias</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/estilos.css') }}">
</head>
<body>
    <div class="crud">
        <table>
            <caption>Materias registradas</caption>

            <thead>
                <tr>
                    <th scope="col">Clave Materia</th>
                    <th scope="col">Nombre de la materia</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaMaterias">
                 {% for mat in materias%}
                <tr>
                    <td>
                        {{ mat[0] }}
                    </td>
                    <td>
                       {{ mat[1] }}
                    </td>
                    <td>
                        <button type="button" onclick="editarMateria(this)">
                            Editar
                        </button>

                        <button type="button" onclick="eliminarMateria(this)">
                            Eliminar
                        </button>
                    </td>
                </tr>
                {% endfor %}  
            </tbody>
        </table>
    </div>
</body>
</html>
