<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Agregar Grupo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/estilos.css') }}">
</head>

<body>
    <form onsubmit="verificar()">
        <h1>Grupo Nuevo</h1>
        <label for="cveGru">Clave de grupo:</label>
        <input type="text" id="cveGru" maxlength="7" pattern="[A-Z]{4}[0-9]{3}" required>
        <br><br>
        <label for="numAlu">Numero de alumnos:</label>
        <input type="number" id="numAlu" min="1" max="99" required>
        <br><br>
        <button type="submit">Guardar</button>
        <button type="reset">Limpiar</button>

    </form>

    <script>
        function verificar() {
            alert("El grupo se registro exitosamente");
        }
    </script>
</body>

</html>
