<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/estilos.css') }}">
    <title>Registro de preguntas</title>
</head>

<body>
    <h1>Registro de preguntas</h1>

    <form id="preguntaFormulario" action="/seap/guardarPre" method="post">
        {% if mensaje %}
            <script>
                alert("{{mensaje}}")
            </script>
        {% endif %}  
        <label for="pregunta">Pregunta:</label><br><br>
        <textarea id="pregunta" name="pregunta" maxlength="255" rows="3" required></textarea>
        <br><br>

        <button type="submit">Guardar</button>
        <button type="reset">Limpiar</button>
    </form>

</body>

</html>
