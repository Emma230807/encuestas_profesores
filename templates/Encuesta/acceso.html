<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/estilos.css') }}">
    <title>Acceso alumno</title>
</head>

<body>
    <h1>Acceso alumno</h1>

    {% if mensaje %}
        <div id="alerta" data-mensaje="{{ mensaje }}"></div>

        <script>
            alert(document.getElementById("alerta").dataset.mensaje);
        </script>
    {% endif %}

    <form id="accesoFormulario" method="POST"
          action="/validarSesion" onsubmit="comenzarEncuesta()">

        <label for="grupo">Selecciona tu grupo:</label><br><br>

        <select id="grupo" name="grupo" required>
            <option value="">Seleccione un grupo</option>

            {% for g in grupos %}
                <option value="{{ g.cveGru }}">{{ g.cveGru }}</option>
            {% endfor %}
        </select>

        <br><br>

        <button type="submit">Comenzar encuesta</button>

    </form>

    <script>
        function comenzarEncuesta() {
            const grupo = document.getElementById("grupo").value;

            sessionStorage.setItem("grupo", grupo);
            sessionStorage.setItem("encuestaPendiente", "true");
        }
    </script>
</body>

</html>
