<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Gestion de Profesores</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/estilos.css') }}">
</head>
<body>
    <div class="crud">
        <table>
            <h1>Profesores</h1>
            <thead>
                <tr>
                    <th>Clave Profesor</th>
                    <th>Nombre Completo</th>
                    <th>Correo</th>
                </tr>
            </thead>
            <tbody>
             {% for profesor in profesores %}
                <tr>
                    <td>{{ profesor[0] }}</td>
                    <td>{{ profesor[1] }}</td>
                    <td>{{ profesor[2] }}</td>
                </tr>
              {% endfor %}  
            </tbody>
        </table>
        <button>Editar</button>
        <button>Eliminar</button>
    </div>
</body>
</html>
