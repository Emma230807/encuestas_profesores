<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Estilos/estilos.css">
    <title>Registro Profesor</title>
</head>

<body>
    <h2>Registro Profesor</h2>

    <form id="profesorFormulario" onsubmit="verficacion()">

        <!--Numero de empleado-->
        <label for="clave">Clave de empleado:</label><br><br>
        <input type="text" id="clave" name="clave" minlength="1" maxlength="20" pattern="[0-9]+" required>
        <br><br>

        <!-- Nombre -->
        <label for="nombre">Nombre:</label><br><br>
        <input type="text" id="nombre" name="nombre" pattern="[A-Z][a-z]+( [A-Z][a-z]+)*" required>
        <br><br>

        <!-- Apellido Paterno -->
        <label for="apellidoPaterno">Apellido Paterno:</label><br><br>
        <input type="text" id="apellidoPaterno" name="apellidoPaterno" pattern="[A-Z]{1}[a-z]+" required>
        <br><br>

        <!--Apellido Materno-->
        <label for="apellidoMaterno">Apellido Materno:</label><br><br>
        <input type="text" id="apellidoMaterno" name="apellidoMaterno" pattern="[A-Z]{1}[a-z]+" required>
        <br><br>

        <!--Correo electronico-->
        <label for="correo">Correo Electronico:</label><br><br>
        <input type="email" id="correo" name="correo" required>
        <br><br>

        <button type="submit">Guardar</button>
        <button type="reset">Limpiar</button>
    </form>

    <div class="crud">
        <table>
            <caption>Profesores</caption>
            <thead>
                <tr>
                    <th>Numero de Emleado</th>
                    <th>Profesor</th>
                    <th>Correo</th>
                </tr>

            </thead>
            <tr>
                <th>2009</th>
                <th>Ricardo Muro Gómez</th>
                <th>ricardomurog4@gmail.com</th>
            </tr>
        </table>
        <button>Editar</button>
        <button>Eliminar</button>
    </div>
    
    <script>
        function verficacion(event) {
            alert("Profesor registrado correctamente");
        }
    </script>

    <p><a href="../index.html">Volver al menú</a></p>

</body>

</html>
</body>

</html>
