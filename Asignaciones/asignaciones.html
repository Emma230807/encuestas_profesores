<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Estilos/estilos.css">
    <title>Asignación de profesores</title>
</head>
<body>
    <h1>Asignación de profesores</h1>
    
    <form id="sesionFormulario" onsubmit="validarSesion(event)">

        <label for="profesor">Profesor:</label><br><br>
        <select id="profesor" name="profesor" required>
            <option value="">Seleccione un profesor</option>
        </select>
        <br><br>

        <label for="grupo">Grupo:</label><br><br>
        <select id="grupo" name="grupo" required>
            <option value="">Seleccione un grupo</option>
        </select>
        <br><br>

        <label for="materia">Materia:</label><br><br>
        <select id="materia" name="materia" required>
            <option value="">Seleccione una materia</option>
        </select>
        <br><br>

        <button type="submit">Programar sesión</button>

    </form>
    <p><a href="../index.html">Volver al menú</a></p>
    <script src="../Scripts/asignaciones.js"></script>
</body>
</html>
