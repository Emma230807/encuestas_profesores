<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="../Estilos/encuesta.css">
    <title>Encuesta</title>
</head>

<body>
    <h1>Encuesta</h1>
    <form onsubmit="guardar(event)" method="post">

        <input type="text" name="grupo" id="grupo" value="GTID243" readonly>

        <select name="maestro" id="maestro">
            <option value="sustaita">Sustaita</option>
            <option value="muro">Muro</option>
            <option value="tacho">Tacho</option>
        </select>

        <select name="materia" id="materia">
            <option value="poo">POO</option>
            <option value="bdd">BDD</option>
            <option value="movil">Movil</option>
        </select>

        <br>
        <br>

        <label id="pregunta"></label>
        <br>
        <br>

        <div class="opciones" id="contenedor">
            <label><input type="radio" name="opciones" value="5" required>5</label>
            <label><input type="radio" name="opciones" value="6">6</label>
            <label><input type="radio" name="opciones" value="7">7</label>
            <label><input type="radio" name="opciones" value="8">8</label>
            <label><input type="radio" name="opciones" value="9">9</label>
            <label><input type="radio" name="opciones" value="10">10</label>
        </div>
        <br>

        <div id="seccionComentario" style="display: none;">
            <label for="comentario">Comentario sobre el maestro:</label>
            <br>
            <textarea name="comentario" id="comentario"></textarea>
            <br>
            <br>
        </div>

        <input type="submit" id="btnEnviar" value="Siguiente pregunta">

        <script>
            const preguntas = [
                "1. El profesor expone los contenidos y prácticas de su asignatura de manera clara, gradual y congruente.",
                "2. El profesor proporciona orientación y apoyo a los alumnos con problemas de aprendizaje.",
                "3. Propicia un ambiente de confianza y de participación durante la clase."
            ];

            let numPreg = 0;
            let respuestasGuardadas = [];

            document.getElementById("pregunta").textContent = preguntas[numPreg];

            function guardar(event) {
                event.preventDefault();

                const seccionComentario = document.getElementById("seccionComentario");
                const primerRadio = document.querySelector('input[name="opciones"]');
                
                if (seccionComentario.style.display === "block") {
                    document.getElementById("comentario").value = ""; 
                    
                    seccionComentario.style.display = "none";
                    
                    document.getElementById("contenedor").style.display = "block";
                    primerRadio.required = true; 
                    
                    document.getElementById("btnEnviar").value = "Siguiente pregunta";
                    
                    const selectMaestro = document.getElementById("maestro");
                    let nuevoIndice = selectMaestro.selectedIndex + 1;

                    if (nuevoIndice >= selectMaestro.options.length) {
                        alert("Has evaluado a todos los maestros. Encuesta finalizada.");
                        document.getElementById("btnEnviar").style.display = "none";
                        document.getElementById("contenedor").style.display = "none";
                        document.getElementById("pregunta").textContent = "Encuesta terminada de forma exitosa.";
                    } else {
                        selectMaestro.selectedIndex = nuevoIndice;
                        
                        document.getElementById("materia").selectedIndex = nuevoIndice; 
                        
                        numPreg = 0;
                        respuestasGuardadas = [];
                        document.getElementById("pregunta").textContent = preguntas[numPreg];
                    }
                    return;
                }

                const seleccionado = document.querySelector('input[name="opciones"]:checked');
                respuestasGuardadas.push(parseFloat(seleccionado.value));
                
                seleccionado.checked = false;

                numPreg++;

                if (numPreg < preguntas.length) {
                    document.getElementById("pregunta").textContent = preguntas[numPreg];
                } else {
                    let suma = respuestasGuardadas.reduce((total, actual) => total + actual, 0);
                    let promedio = suma / preguntas.length;

                    alert("Tu promedio de evaluación para este maestro es: " + promedio.toFixed(2));

                    document.getElementById("pregunta").textContent = "Por favor, deja un comentario final para este profesor.";
                    document.getElementById("contenedor").style.display = "none"; 
                    seccionComentario.style.display = "block"; 
                    
                    document.getElementById("btnEnviar").value = "Enviar comentario y continuar";
                    
                    primerRadio.required = false; 
                }
            }
        </script>

    </form>
    <p><a href="../index.html">Volver al menú</a></p>
</body>

</html>
