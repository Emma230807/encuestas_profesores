<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="../Estilos/encuesta.css">
    <title>Encuesta</title>
</head>

<body>
    <h1>Encuesta</h1>
    <form onsubmit="guardar(event)" method="post">

        <input type="text" name="grupo" id="grupo" readonly>

        <select name="maestro" id="maestro">
            <option value="sustaita">Sustaita</option>
            <option value="muro">Muro</option>
            <option value="tacho">Tacho</option>
        </select>

        <select name="materia" id="materia">
            <option value="poo">POO</option>
            <option value="bdd">BDD</option>
            <option value="movil">Movil</option>
        </select>

        <br>
        <br>

                <div id="listaPreguntas"></div>

        <div id="seccionComentario">
            <label for="comentario">Comentario sobre el maestro (opcional):</label>
            <br>
            <textarea name="comentario" id="comentario" maxlength="500"></textarea>
            <br>
            <br>
        </div>

        <input type="submit" id="btnEnviar" value="Enviar y continuar">

        <script>
            const grupoAlumno = sessionStorage.getItem("grupo");
            if (!grupoAlumno) {
                window.location.href = "acceso.html";
            }
            document.getElementById("grupo").value = grupoAlumno;
            const preguntas = [
                "1. El profesor expone los contenidos y prácticas de su asignatura de manera clara, gradual y congruente.",
                "2. El profesor proporciona orientación y apoyo a los alumnos con problemas de aprendizaje.",
                "3. Propicia un ambiente de confianza y de participación durante la clase."
            ];

            const contenedor = document.getElementById("listaPreguntas");

            preguntas.forEach(function (texto, i) {
                const bloque = document.createElement("div");

                const etiqueta = document.createElement("label");
                etiqueta.textContent = texto;
                bloque.appendChild(etiqueta);
                bloque.appendChild(document.createElement("br"));
                bloque.appendChild(document.createElement("br"));

                const opciones = document.createElement("div");
                opciones.className = "opciones";

                for (let valor = 5; valor <= 10; valor++) {
                    const opcion = document.createElement("label");
                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = "p" + i;
                    radio.value = valor;
                    radio.required = true;
                    opcion.appendChild(radio);
                    opcion.appendChild(document.createTextNode(valor));
                    opciones.appendChild(opcion);
                }

                bloque.appendChild(opciones);
                bloque.appendChild(document.createElement("br"));
                contenedor.appendChild(bloque);
            });

            function guardar(event) {
                event.preventDefault();

                let suma = 0;
                for (let i = 0; i < preguntas.length; i++) {
                    const seleccionado = document.querySelector('input[name="p' + i + '"]:checked');
                    suma += Number(seleccionado.value);
                }

                const promedio = suma / preguntas.length;
                 alert("Evaluación enviada correctamente.");

                const selectMaestro = document.getElementById("maestro");
                const nuevoIndice = selectMaestro.selectedIndex + 1;

                if (nuevoIndice >= selectMaestro.options.length) {
                    alert("Has evaluado a todos los maestros. Encuesta finalizada.");
                    document.getElementById("listaPreguntas").textContent = "Encuesta terminada de forma exitosa.";
                    document.getElementById("seccionComentario").style.display = "none";
                    document.getElementById("btnEnviar").style.display = "none";
                    return;
                }

                selectMaestro.selectedIndex = nuevoIndice;
                document.getElementById("materia").selectedIndex = nuevoIndice;
                document.getElementById("comentario").value = "";
                document.querySelectorAll('#listaPreguntas input[type="radio"]').forEach(function (r) {
                    r.checked = false;
                });
                window.scrollTo(0, 0);
            }
        </script>

    </form>
    <p><a href="../index.html">Volver al menú</a></p>
</body>

</html>
