<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="../Estilos/encuesta.css">
    <title>Encuesta</title>
</head>

<body>
    <h1>Encuesta</h1>
    <form onsubmit="guardar(event)" method="post">

        <input type="text" name="grupo" id="grupo" value="GTID243" readonly>

        <select name="maestro" id="maestro">
            <option value="sustaita">Sustaita</option>
            <option value="muro">Muro</option>
            <option value="tacho">Tacho</option>
        </select>

        <select name="materia" id="materia">
            <option value="poo">POO</option>
            <option value="bdd">BDD</option>
            <option value="movil">Movil</option>
        </select>

        <br>
        <br>

        //Ajustar de acuedo a l informacion obtenida de base de datos
        <label for="p1">1. El profesor expone los contenidos y prácticas de su asignatura de manera clara, gradual y
            congruente.</label>
        <br>
        <br>

        <div class="opciones">
            <label><input type="radio" name="p1" value="5" required>5</label>
            <label><input type="radio" name="p1" value="6">6</label>
            <label><input type="radio" name="p1" value="7">7</label>
            <label><input type="radio" name="p1" value="8">8</label>
            <label><input type="radio" name="p1" value="9">9</label>
            <label><input type="radio" name="p1" value="10">10</label>
        </div>
        <br>


        <label for="comentario">Comentario</label>
        <textarea name="comentario" id="comentario"></textarea>
        <br>
        <br>

        <input type="submit" value="Enviar">

        <script>
            function guardar(event) {
                let promedio = 0;
                let suma = 0;

                for (let i = 1; i <= 12; i++) {
                    let respuesta = document.querySelector('input[name="p' + i + '"]:checked');

                    if (respuesta) {
                        suma += parseFloat(respuesta.value);
                    }
                }
                promedio = suma / 12;
                alert(promedio.toFixed(2));
            }


        </script>

    </form>
    <p><a href="../index.html">Volver al menú</a></p>
</body>
</html>
