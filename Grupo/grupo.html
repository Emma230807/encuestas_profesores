<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="../Estilos/estilos.css">
    <title>Carga de Alumnos</title>
</head>
<body>
    <form onsubmit="verificar()">
        <h1>Aqui carga los grupos con la cantidad de Alumnos</h1>
        <label for="cveGru">Clave de grupo:</label>
        <input type="text" id="cveGru" maxlength="7" pattern="[A-Z]{4}[0-9]{3}" required>
        <br><br>
        <label for="numAlu">Numero de alumnos:</label>
        <input type="number" id="numAlu" min="1" max="99" required>
        <br><br>
        <button type="submit">Guardar</button>
        <button type="reset">Limpiar</button>

    </form>
      <br>
      <div class="crud">
            <table>
                <caption>Lista de grupos agregados</caption>
                <thead>
                    <tr>
                        <th>Grupo</th>
                        <th>Num Alumnos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>GTID243</th>
                        <th>19</th>
                    </tr>
                </tbody>
            </table>
                <button>Editar</button>
                <button>Eliminar</button>
        </div>
     <p><a href="../index.html">Volver al menú</a></p>
     <script>
        function verificar(){
            alert("El grupo se registro exitosamente"); 
        }

     </script>
</body>
</html>
